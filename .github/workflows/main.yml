name: Build Image

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Update apt
      run: sudo apt-get update
    - name: Install Dependencies
      run: sudo apt install coreutils p7zip-full qemu-user-static python3-git
    - name: Checkout CustomPiOS
      uses: actions/checkout@v2
      with:
        repository: 'guysoft/CustomPiOS'
        path: CustomPiOS
    - name: Checkout Project Repository
      uses: actions/checkout@v2
      with:
        repository: ${{ github.repository }}
        path: repository
        submodules: true
    # Pinned dated release + sha256 from src/config (D6) — no *_latest.
    # Arch matrix (arm64/armhf) lands with FPOS-010; until then this
    # builds the current default (armhf).
    - name: Download Raspberry Pi OS image (pinned)
      run: |
        cd repository/src/image || exit 1
        source ../config
        wget -q "$FULLPAGEOS_IMAGE_URL_ARMHF"
        echo "$FULLPAGEOS_IMAGE_SHA256_ARMHF  $(basename "$FULLPAGEOS_IMAGE_URL_ARMHF")" | sha256sum -c
    - name: Update CustomPiOS Paths
      run: cd repository/src && ../../CustomPiOS/src/update-custompios-paths
    - name: Build Image
      run: sudo modprobe loop && cd repository/src && sudo bash -x ./build_dist
    - name: Copy Output
      run: cp ${{ github.workspace }}/repository/src/workspace/*-raspios-*-lite.img build.img
    - name: Zip Output
      run: gzip build.img
    - uses: actions/upload-artifact@v4
      with:
        name: build.img.gz
        path: build.img.gz
