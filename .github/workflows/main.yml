name: Build Image

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Update apt
      run: sudo apt-get update
    - name: Install Dependencies
      run: sudo apt install coreutils p7zip-full qemu-user-static python3-git
    - name: Checkout CustomPiOS
      uses: actions/checkout@v2
      with:
        repository: 'guysoft/CustomPiOS'
        path: CustomPiOS
    - name: Checkout Project Repository
      uses: actions/checkout@v2
      with:
        repository: ${{ github.repository }}
        path: repository
        submodules: true
    # Pinned dated release + sha256 from src/config (D6) — no *_latest.
    # Arch matrix (arm64/armhf) lands with FPOS-010; until then this
    # builds the default (arm64, D8).
    - name: Download Raspberry Pi OS image (pinned)
      run: |
        cd repository/src/image || exit 1
        source ../config
        wget -q "$FULLPAGEOS_IMAGE_URL_ARM64"
        echo "$FULLPAGEOS_IMAGE_SHA256_ARM64  $(basename "$FULLPAGEOS_IMAGE_URL_ARM64")" | sha256sum -c
    - name: Update CustomPiOS Paths
      run: cd repository/src && ../../CustomPiOS/src/update-custompios-paths
    - name: Build Image
      run: sudo modprobe loop && cd repository/src && sudo bash -x ./build_dist
    # D9 artifact naming: FullPageOS-<codename>-<arch>[-docker]-<version>.img.gz.
    # src/get_image_name derives the name from the build's own config chain
    # AND the built image's filename (and fails on any mismatch), so an armhf
    # build can never be labeled arm64.
    - name: Name and Compress Output
      id: artifact
      run: |
        cd repository/src || exit 1
        NAME="$(./get_image_name)"
        IMG="$(./get_image_name --image-path)"
        cp "${IMG}" "${GITHUB_WORKSPACE}/${NAME}.img"
        gzip "${GITHUB_WORKSPACE}/${NAME}.img"
        echo "name=${NAME}" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.name }}.img.gz
        path: ${{ steps.artifact.outputs.name }}.img.gz
